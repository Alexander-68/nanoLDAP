{{define "login.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NanoLDAP — Sign in</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">nanoldap<span class="brand-tag">admin</span></div>
      <h1>Sign in</h1>
      <p class="lede">The web console is restricted to members of the <code>admins</code> group.</p>
      {{if .Error}}<div class="message">{{.Error}}</div>{{end}}
      <form method="post" action="/login">
        <label>Username
          <input name="username" autocomplete="username" autofocus required>
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Sign in</button>
      </form>
      <p class="login-footnote">Download the self-signed certificate at <a href="/ca.crt"><code>/ca.crt</code></a>.</p>
    </section>
  </main>
</body>
</html>
{{end}}
